<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Count</title>
</head>
<body>
    <div id="playerCount">Loading...</div>

    <script>
        async function fetchPlayerCount() {
            const url = "http://live.blrp.dk:30120/players.json";
            const playerCountElement = document.getElementById('playerCount');
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const players = await response.json();
                
                // Count the number of players
                const playerCount = Array.isArray(players) ? players.length : 0;
                
                // Display the player count
                playerCountElement.innerHTML = playerCount;
                
            } catch (error) {
                console.error('Error fetching player data:', error);
                playerCountElement.innerHTML = 'Failed to retrieve player data';
            }
        }

        // Fetch player count when page loads
        fetchPlayerCount();
    </script>
</body>
</html>
