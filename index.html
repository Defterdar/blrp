<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>We Were Here</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1f1f1f, #000);
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 100vw;
      padding: 20px;
      animation: fadeIn 4s ease-in-out forwards;
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 2px;
      margin: 0;
      opacity: 0;
      animation: appear 3s ease-out 1s forwards;
    }

    p {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: #bbbbbb;
      opacity: 0;
      animation: appear 3s ease-out 2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes appear {
      to { opacity: 1; }
    }

    .glow {
      text-shadow: 0 0 10px #fff, 0 0 20px #aaa, 0 0 40px #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="glow">We Were Here</h1>
    <p>Thank you for being a part of our journey.</p>
  </div>
</body>
</html>
